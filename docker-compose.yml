services:
  db:
    image: postgres:16
    container_name: Db_secretaria
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-Secretaria}
    ports:
      - "${DB_PORT:-1804}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
